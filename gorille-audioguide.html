<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Gorille – Audioguide</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark:       #1a2a1a;
    --deep:       #0f1a0f;
    --green1:     #2d5a1b;
    --green2:     #4a8c2a;
    --green3:     #6ab840;
    --green-lt:   #9dd66b;
    --moss:       #3d6b2a;
    --tan:        #c8a96e;
    --bark:       #7a5230;
    --cream:      #f5eed8;
    --shadow:     rgba(10,30,10,0.45);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #1e3a1a 0%, #0f1f0d 50%, #0a1408 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    color: var(--cream);
  }

  /* ── LEAVES BACKGROUND ── */
  .bg-leaves {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .leaf {
    position: absolute;
    opacity: 0.07;
    animation: leafSway ease-in-out infinite;
  }
  .leaf svg { fill: var(--green3); }

  .leaf:nth-child(1)  { top:5%;   left:-2%;  width:220px; animation-duration:7s;  animation-delay:0s; }
  .leaf:nth-child(2)  { top:12%;  right:-3%; width:180px; animation-duration:9s;  animation-delay:1s; transform:scaleX(-1); }
  .leaf:nth-child(3)  { top:35%;  left:-4%;  width:260px; animation-duration:8s;  animation-delay:2s; }
  .leaf:nth-child(4)  { top:55%;  right:-5%; width:300px; animation-duration:10s; animation-delay:0.5s; transform:scaleX(-1); }
  .leaf:nth-child(5)  { top:75%;  left:-3%;  width:200px; animation-duration:6s;  animation-delay:3s; }
  .leaf:nth-child(6)  { bottom:5%;right:-2%; width:240px; animation-duration:11s; animation-delay:1.5s; transform:scaleX(-1); }

  @keyframes leafSway {
    0%,100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg); }
  }
  .leaf:nth-child(2):nth-child(even),
  .leaf:nth-child(4) { }

  /* ── FIREFLIES ── */
  .firefly {
    position: fixed;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #c8f060;
    box-shadow: 0 0 8px 3px rgba(180,240,60,0.6);
    pointer-events: none;
    z-index: 1;
    animation: flyFloat linear infinite;
  }
  .firefly:nth-child(1)  { left:10%; top:20%; animation-duration:18s; animation-delay:0s;  }
  .firefly:nth-child(2)  { left:30%; top:60%; animation-duration:22s; animation-delay:3s;  }
  .firefly:nth-child(3)  { left:55%; top:15%; animation-duration:16s; animation-delay:6s;  }
  .firefly:nth-child(4)  { left:75%; top:45%; animation-duration:20s; animation-delay:1s;  }
  .firefly:nth-child(5)  { left:88%; top:70%; animation-duration:14s; animation-delay:4s;  }
  .firefly:nth-child(6)  { left:20%; top:80%; animation-duration:25s; animation-delay:8s;  }
  @keyframes flyFloat {
    0%   { transform: translate(0,0);        opacity:0; }
    10%  { opacity:1; }
    50%  { transform: translate(60px,-80px); opacity:0.8; }
    90%  { opacity:1; }
    100% { transform: translate(-40px,40px); opacity:0; }
  }

  /* ── TOP VINES ── */
  .vine-bar {
    position: fixed;
    top:0; left:0; right:0;
    height: 8px;
    background: repeating-linear-gradient(90deg,
      #2d5a1b 0px, #4a8c2a 40px, #2d5a1b 80px);
    z-index: 10;
  }
  .vine-hang {
    position: fixed;
    top:0; z-index:9;
    display:flex; gap:0;
    pointer-events:none;
  }
  .vine-strand {
    width: 3px;
    background: linear-gradient(to bottom, #4a8c2a, transparent);
    border-radius: 0 0 2px 2px;
    animation: vineSwing ease-in-out infinite;
    transform-origin: top center;
  }
  @keyframes vineSwing {
    0%,100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }

  /* ── LAYOUT ── */
  .wrapper {
    position: relative;
    z-index: 2;
    max-width: 1000px;
    margin: 0 auto;
    padding: 70px 24px 100px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 60px;
  }
  .gorilla-icon {
    font-size: 80px;
    display: block;
    margin-bottom: 12px;
    animation: gorillaBounce 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
  }
  @keyframes gorillaBounce {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }

  h1 {
    font-family: 'Cabin Sketch', cursive;
    font-size: clamp(2rem, 6vw, 3.6rem);
    font-weight: 700;
    color: var(--cream);
    text-shadow:
      0 0 40px rgba(106,184,64,0.4),
      3px 3px 0 rgba(0,0,0,0.5);
    line-height: 1.1;
    letter-spacing: 1px;
  }

  .subtitle {
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--green-lt);
    letter-spacing: 0.12em;
    font-weight: 700;
    opacity: 0.85;
  }

  /* ── CARDS ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 28px;
  }

  .card {
    background: linear-gradient(145deg, rgba(30,55,20,0.92), rgba(15,28,12,0.95));
    border-radius: 24px;
    padding: 36px 28px 32px;
    border: 2px solid rgba(74,140,42,0.35);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(157,214,107,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    opacity: 0.06;
    transition: transform 0.4s ease, opacity 0.3s ease;
  }
  .card-1::before { background: var(--green3); }
  .card-2::before { background: var(--tan); }
  .card-3::before { background: var(--green-lt); }

  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 0 0 24px 24px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card-1::after { background: linear-gradient(90deg, var(--green2), var(--green3)); }
  .card-2::after { background: linear-gradient(90deg, var(--tan), var(--bark)); }
  .card-3::after { background: linear-gradient(90deg, var(--green-lt), var(--green3)); }

  .card:hover {
    transform: translateY(-7px) scale(1.01);
    border-color: rgba(106,184,64,0.6);
    box-shadow:
      0 20px 56px rgba(0,0,0,0.6),
      0 0 30px rgba(74,140,42,0.15),
      inset 0 1px 0 rgba(157,214,107,0.15);
  }
  .card:hover::before { transform: scale(1.8); opacity: 0.1; }
  .card:hover::after  { opacity: 1; }

  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Cabin Sketch', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 24px;
    line-height: 1.3;
  }
  .card-1 .card-badge { color: var(--green-lt); }
  .card-2 .card-badge { color: var(--tan); }
  .card-3 .card-badge { color: #b8e87a; }

  .chapter-icon { font-size: 1.4rem; }

  /* ── PLAYER ── */
  .player {
    background: rgba(0,0,0,0.3);
    border-radius: 18px;
    padding: 20px 18px 18px;
    border: 1px solid rgba(74,140,42,0.2);
  }

  .play-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 0;
  }

  .play-btn {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    position: relative;
    outline: none;
  }
  .card-1 .play-btn {
    background: linear-gradient(135deg, #4a8c2a, #6ab840);
    box-shadow: 0 4px 16px rgba(74,140,42,0.5);
  }
  .card-2 .play-btn {
    background: linear-gradient(135deg, #a07840, #c8a96e);
    box-shadow: 0 4px 16px rgba(122,82,48,0.5);
  }
  .card-3 .play-btn {
    background: linear-gradient(135deg, #6ab840, #9dd66b);
    box-shadow: 0 4px 16px rgba(106,184,64,0.5);
  }
  .play-btn:hover  { transform: scale(1.12); filter: brightness(1.15); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 22px; height: 22px; fill: #fff; }

  .time-block { flex: 1; }

  .progress-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    cursor: pointer;
    margin-bottom: 7px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    border-radius: 99px;
    width: 0%;
    transition: width 0.2s linear;
  }
  .card-1 .progress-bar { background: linear-gradient(90deg, #4a8c2a, #9dd66b); }
  .card-2 .progress-bar { background: linear-gradient(90deg, #7a5230, #c8a96e); }
  .card-3 .progress-bar { background: linear-gradient(90deg, #6ab840, #c8f060); }

  .time-text {
    font-size: 0.72rem;
    color: rgba(200,220,180,0.5);
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.05em;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    margin-top: 64px;
    font-size: 0.8rem;
    color: rgba(157,214,107,0.4);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .wrapper { padding: 50px 16px 80px; }
    .cards   { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Vine top bar -->
<div class="vine-bar"></div>

<!-- Animated background leaves -->
<div class="bg-leaves">
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
  <div class="leaf">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 280 C20 200 0 100 100 10 C200 100 180 200 100 280Z"/>
    </svg>
  </div>
</div>

<!-- Fireflies -->
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>

<div class="wrapper">
  <header>
    <span class="gorilla-icon">🦍</span>
    <h1>Le Gorille – Audioguide</h1>
    <p class="subtitle">🌿 Plonge dans la jungle des gorilles 🌿</p>
  </header>

  <div class="cards">

    <!-- CARD 1 -->
    <div class="card card-1">
      <div class="card-badge">
        <span class="chapter-icon">🌱</span>
        Données de base et habitat
      </div>
      <div class="player">
        <div class="play-row">
          <button class="play-btn" id="btn-1" onclick="togglePlay(1)" aria-label="Lecture / Pause">
            <svg id="icon-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="time-block">
            <div class="progress-wrap" id="prog-wrap-1" onclick="seek(event, 1)">
              <div class="progress-bar" id="prog-1"></div>
            </div>
            <div class="time-text">
              <span id="cur-1">0:00</span>
              <span id="dur-1">0:00</span>
            </div>
          </div>
        </div>
      </div>
      <audio id="audio-1" src="1.mp3" preload="metadata"></audio>
    </div>

    <!-- CARD 2 -->
    <div class="card card-2">
      <div class="card-badge">
        <span class="chapter-icon">🍌</span>
        Alimentation
      </div>
      <div class="player">
        <div class="play-row">
          <button class="play-btn" id="btn-2" onclick="togglePlay(2)" aria-label="Lecture / Pause">
            <svg id="icon-2" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="time-block">
            <div class="progress-wrap" id="prog-wrap-2" onclick="seek(event, 2)">
              <div class="progress-bar" id="prog-2"></div>
            </div>
            <div class="time-text">
              <span id="cur-2">0:00</span>
              <span id="dur-2">0:00</span>
            </div>
          </div>
        </div>
      </div>
      <audio id="audio-2" src="2.mp3" preload="metadata"></audio>
    </div>

    <!-- CARD 3 -->
    <div class="card card-3">
      <div class="card-badge">
        <span class="chapter-icon">⚖️</span>
        Aspects positifs et négatifs
      </div>
      <div class="player">
        <div class="play-row">
          <button class="play-btn" id="btn-3" onclick="togglePlay(3)" aria-label="Lecture / Pause">
            <svg id="icon-3" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="time-block">
            <div class="progress-wrap" id="prog-wrap-3" onclick="seek(event, 3)">
              <div class="progress-bar" id="prog-3"></div>
            </div>
            <div class="time-text">
              <span id="cur-3">0:00</span>
              <span id="dur-3">0:00</span>
            </div>
          </div>
        </div>
      </div>
      <audio id="audio-3" src="3.mp3" preload="metadata"></audio>
    </div>

  </div>

  <footer>Projet scolaire – Exposition sur les animaux</footer>
</div>

<script>
  const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  const PLAY_PATH  = 'M8 5v14l11-7z';

  function fmt(s) {
    if (isNaN(s) || !isFinite(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2,'0');
  }

  function togglePlay(n) {
    const audio = document.getElementById('audio-' + n);
    [1,2,3].forEach(i => {
      if (i !== n) {
        const a = document.getElementById('audio-' + i);
        if (!a.paused) { a.pause(); updateIcon(i, false); }
      }
    });
    if (audio.paused) { audio.play(); updateIcon(n, true); }
    else              { audio.pause(); updateIcon(n, false); }
  }

  function updateIcon(n, playing) {
    document.getElementById('icon-' + n).querySelector('path').setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
  }

  function seek(e, n) {
    const audio = document.getElementById('audio-' + n);
    const wrap  = document.getElementById('prog-wrap-' + n);
    const ratio = e.offsetX / wrap.offsetWidth;
    if (audio.duration) audio.currentTime = ratio * audio.duration;
  }

  [1,2,3].forEach(n => {
    const audio = document.getElementById('audio-' + n);
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('prog-' + n).style.width = pct + '%';
      document.getElementById('cur-' + n).textContent  = fmt(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('dur-' + n).textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended', () => updateIcon(n, false));
  });
</script>
</body>
</html>
